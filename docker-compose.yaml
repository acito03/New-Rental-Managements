version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rental_sys_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/rental_sys
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-rental-sys-secret-change-in-production}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rental_network
    volumes:
      - app_logs:/app/logs

  db:
    image: postgres:16-alpine
    container_name: rental_sys_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=rental_sys
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rental_sys"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rental_network

volumes:
  postgres_data:
    driver: local
  app_logs:
    driver: local

networks:
  rental_network:
    driver: bridge
